[package]
name = "recipe"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
path = "recipe.rs"

[[bin]]
name = "recipe"
path = "cli.rs"

[dependencies]

[package.metadata.recipe]
dependency-allowlist = []
multi-device = "auto"
contraction-cpu-shared-values = 65536
contraction-register-m = 8
contraction-register-n = 8
contraction-fragment-k = 16
contraction-chunk-k = 64
contraction-local-chunks = 3
contraction-k-partitions = 32
contraction-split-span = 128
contraction-matrix-split-span = 64
contraction-swizzle-m-tiles = 4
contraction-resident-waves-per-workgroup = 2
contraction-matrix-max-waves-per-workgroup = 4
attention-query-tile = 24
# Positions per delta rule chunk. One commits the carried state every step, which
# is the decode schedule; the value never changes the result.
delta-chunk = 8
topology-probe-bytes = 4194304
# Device memory left free for backend allocations made by the first inference
# dispatch after a placement has loaded its module and resident buffers, and for
# the compositor of a device that drives a display: at 16 MB the context fitter
# filled the desktop card to the edge and kwin could no longer pin a framebuffer.
placement-launch-reserve-bytes = 536870912
# Zero uses every logical CPU available to the process. A positive value limits the worker count.
cpu-worker-threads = 0
# Toolchain values are keyed by target operating system. A value beginning with
# `$` names the installer-provided environment variable that contains its root.
null-device = { linux = "/dev/null", macos = "/dev/null", windows = "NUL" }
cpu-compiler = { linux = "/usr/bin/clang", macos = "/usr/bin/clang", windows = "$ProgramFiles/LLVM/bin/clang.exe" }
cpu-linker = { linux = "/usr/bin/ld", macos = "/usr/bin/ld", windows = "$ProgramFiles/LLVM/bin/lld-link.exe" }
cpu-linker-driver = { linux = "ld", macos = "ld", windows = "lld" }
cpu-library-flags = { linux = "-fPIC", macos = "-fPIC", windows = "" }
cpu-entry-linkage = { linux = "", macos = "", windows = "dllexport" }
cpu-link-flags = { linux = "", macos = "", windows = "-Wl,-noimplib" }
cpu-module-suffix = { linux = "", macos = "", windows = "@_fltused = dso_local constant i32 39029" }
hsa-compiler = { linux = "/opt/rocm/lib/llvm/bin/clang" }
hsa-runtime = { linux = "libhsa-runtime64.so.1" }
hsa-device-library = { linux = "/opt/rocm/amdgcn/bitcode/ocml.bc" }
hsa-clock-library = { linux = "/opt/rocm/amdgcn/bitcode/ockl.bc" }
hsa-abi-library = { linux = "/opt/rocm/amdgcn/bitcode/oclc_abi_version_600.bc" }
hsa-device-library-directory = { linux = "/opt/rocm/amdgcn/bitcode" }
hsa-finite-library = { linux = "/opt/rocm/amdgcn/bitcode/oclc_finite_only_off.bc" }
hsa-math-library = { linux = "/opt/rocm/amdgcn/bitcode/oclc_unsafe_math_off.bc" }
nvidia-ptx = "ptx71"
nvidia-compiler = { linux = "/usr/bin/clang", windows = "$ProgramFiles/LLVM/bin/clang.exe" }
nvidia-codegen = { linux = "/usr/bin/llc", windows = "$ProgramFiles/LLVM/bin/llc.exe" }
nvidia-runtime = { linux = "libcuda.so.1", windows = "nvcuda.dll" }
nvidia-toolkit = { linux = "/opt/cuda", windows = "$CUDA_PATH" }
nvidia-device-library = "nvvm/libdevice/libdevice.10.bc"
nvidia-assembler = "bin/ptxas"

[package.metadata.train]
epochs = 210
learning-rate = 0.0092
initial-weight = 0.01
adamw-beta1 = 0.9
adamw-beta2 = 0.999
adamw-epsilon = 0.00000001
adamw-weight-decay = 0.01
kmeans-iterations = 8
svm-iterations = 128
svm-learning-rate = 0.1
svm-regularization = 0.001
svm-epsilon = 0.1
tree-depth = 5
tree-min-rows = 4
forest-feature-fraction = 0.7
bayes-prior-precision = 0.001
bayes-noise-variance = 1.0
bayes-variance-epsilon = 0.000001
boost-iterations = 8
boost-learning-rate = 0.1
catboost-ordered-prior = 1.0
catboost-border-count = 32
xgboost-l2-regularization = 1.0
xgboost-minimum-gain = 0.000001
lightgbm-histogram-bins = 16
lightgbm-leaves = 8
quantization-block-weights = 64
surrogate-epochs = 8
surrogate-rate = 0.01
surrogate-width = 8
schedule-candidates = 3
schedule-measurements = 2
schedule-budget = 64
schedule-warmups = 1
schedule-minimum-improvement = 0.05
random-seed = 17
progress-refresh-hz = 240
normalization-epsilon = 0.00001
categorical-ratio = 0.5
leak-slope = 0.01
prelu-slope = 0.25
elu-alpha = 1.0
selu-alpha = 1.6732632423543772
selu-scale = 1.0507009873554805
gelu-scale = 0.7978845608028654
gelu-cubic = 0.044715
huber-threshold = 1.0
output-tolerance = 0.00000001
gradient-tolerance = 0.00001
backend-tolerance = 0.00001

# The precision of every kind of op a block names none for. `recipe run x.rs
# --config <name>` picks a table; a block's own suffix overrides its op.
[precision]
default-config = "recipe"

[precision.recipe]
sum = "fp16"
embed = "fp16"
attn = "fp16"
rope = "fp16"
kv = "fp16"
atvn = "fp16"
norm = "fp16"
res = "fp16"
# The accumulator every block carries unless it names acc(32) or acc(64):
# the running sums of a dot, the softmax and norm statistics.
acc = "fp32"
step = 32

[precision.llamacpp]
sum = "int8"
embed = "fp32"
attn = "fp32"
rope = "fp32"
kv = "fp16"
atvn = "fp32"
norm = "fp32"
res = "fp32"
acc = "fp32"
# llama.cpp's norms sum fp32 squares in double and finish in fp32.
norm-acc = "fp64"
# llama.cpp rounds a sum's inputs to Q8_K: one step per 256.
step = 256
# llama.cpp chains each rope angle by fp32 products and rotates with fmas.
rope-angle = "chain"
# llama.cpp's CPU attention: one query at a time over the keys in order.
attn-softmax = "online"
# llama.cpp's exp, tanh and log are the CPU's libm.
math = "libm"
# llama.cpp reads gelu from an fp16 table between -10 and 10.
gelu-table = "fp16"
