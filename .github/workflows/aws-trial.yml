name: aws trial

# One bounded run of the composition harness on an AWS EC2 L4: build the
# candidate on the worker, run `count` compositions from `cursor`, and return
# the harness's stderr (composition lines and failure packets) as the evidence.
# Dispatched by hand so every run is a counted allowance decision.

on:
  workflow_dispatch:
    inputs:
      cursor:
        description: first composition cursor
        required: true
        default: "20000"
      count:
        description: number of compositions
        required: true
        default: "20"
permissions:
  contents: read

concurrency:
  group: aws-trial-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  trial:
    name: aws/l4 trial
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: recipe-aws-gpu
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_BUCKET: ${{ vars.AWS_BUCKET }}
      AWS_SUBNET_ID: ${{ vars.AWS_SUBNET_ID }}
    steps:
      - name: Check out the controller
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false

      - name: Build the immutable source snapshot
        id: snapshot
        working-directory: controller
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/snapshot"
          git archive --format=tar HEAD | gzip -n > "$GITHUB_WORKSPACE/snapshot/recipe-source.tar.gz"
          sha256="$(sha256sum "$GITHUB_WORKSPACE/snapshot/recipe-source.tar.gz" | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "snapshot sha256=$sha256"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-duration-seconds: 7200

      - name: Launch, poll and collect the AWS trial instance
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/controller/.github/runtime/aws-run.sh"
        env:
          RECIPE_WORKLOAD: trial
          RECIPE_TRIAL_CURSOR: ${{ inputs.cursor }}
          RECIPE_TRIAL_COUNT: ${{ inputs.count }}
          CANDIDATE_SHA: ${{ steps.snapshot.outputs.candidate_sha }}
          SNAPSHOT: ${{ github.workspace }}/snapshot/recipe-source.tar.gz
          SNAPSHOT_SHA256: ${{ steps.snapshot.outputs.sha256 }}
          TRUSTED_RUNTIME: ${{ github.workspace }}/controller/.github/runtime

      - name: Terminate the AWS instance
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
            bash "$GITHUB_WORKSPACE/controller/.github/runtime/aws-terminate.sh"
          else
            echo "no AWS credential; nothing was launched"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-trial
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
