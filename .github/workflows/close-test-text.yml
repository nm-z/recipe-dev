name: PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches:
      - minimal

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Close a pull request containing test text
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          scan_directory="$RUNNER_TEMP/recipe-pr-text-policy"
          mkdir -p "$scan_directory"

          gh api \
            -H 'Accept: application/vnd.github.v3.diff' \
            "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            > "$scan_directory/pull.diff"

          banned_fragment="$(printf 'te%s' 'st')"
          files_url="https://github.com/$REPOSITORY/pull/$PR_NUMBER/files"
          added_file="$scan_directory/added.txt"
          location_file="$scan_directory/added-locations.txt"
          match_file="$scan_directory/matches.txt"
          report_file="$scan_directory/matches.md"
          : > "$added_file"
          : > "$location_file"

          awk -v added_file="$added_file" \
            -v location_file="$location_file" '
            /^diff --git / {
              in_hunk = 0
              next
            }

            !in_hunk && /^\+\+\+ / {
              path = substr($0, 5)
              sub(/\t.*$/, "", path)
              if (length(path) >= 2 && substr(path, 1, 1) == "\"" && substr(path, length(path), 1) == "\"") {
                path = substr(path, 2, length(path) - 2)
              }
              if (path != "/dev/null" && path ~ /^b\//) sub(/^b\//, "", path)
              current_path = path
              next
            }

            /^@@ / {
              in_hunk = match($0, / \+[0-9]+/)
              if (in_hunk) {
                new_line = substr($0, RSTART + 2)
                sub(/,.*/, "", new_line)
                new_line += 0
              }
              next
            }

            !in_hunk { next }

            /^\+/ {
              added_text = substr($0, 2)
              print added_text > added_file
              printf "%s:%d\n", current_path, new_line > location_file
              new_line++
              next
            }

            /^-/ { next }

            /^ / {
              new_line++
              next
            }

          ' "$scan_directory/pull.diff"

          if grep --ignore-case --fixed-strings --word-regexp --line-number \
            "$banned_fragment" "$added_file" > "$match_file"; then
            :
          else
            grep_status=$?
            if (( grep_status == 1 )); then
              exit 0
            fi
            exit "$grep_status"
          fi

          match_count="$(wc -l < "$match_file")"
          if (( match_count == 0 )); then
            exit 0
          fi

          escape_html() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' -e 's/@/\&#64;/g' -e 's/\r/\&#13;/g'
          }
          : > "$report_file"
          mapfile -t added_lines < "$added_file"
          mapfile -t locations < "$location_file"
          while IFS=: read -r added_index _; do
            location="$(printf '%s' "${locations[added_index - 1]}" | escape_html)"
            quote="$(printf '%s' "${added_lines[added_index - 1]}" | escape_html)"
            printf -- '- <a href="%s"><code>%s</code></a>: <pre><code>%s</code></pre>\n' \
              "$files_url" "$location" "$quote" >> "$report_file"
          done < "$match_file"

          # Keep the comment below GitHub's issue-comment limit while retaining
          # the complete location-and-quote report in the workflow summary.
          {
            printf '## Banned whole word in added diff\n\n'
            printf 'Closed automatically because added content in this pull request\x27s current diff contains the banned whole word `%s`. Remove it from the current diff, then reopen this PR.\n\n' "$banned_fragment"
            printf 'The scan covers only added lines in the current diff. Commit history, title, body, file paths, PR comments, and linked issue comments are not scanned.\n\n'
            printf 'Matches (file and current line):\n\n'
          } > "$scan_directory/comment.md"

          {
            printf '## Banned whole word matches\n\n'
            printf 'The following entries are the complete report for the current diff:\n\n'
            cat "$scan_directory/matches.md"
          } >> "$GITHUB_STEP_SUMMARY"
          max_comment_bytes=60000
          LC_ALL=C awk -v max_bytes="$max_comment_bytes" '
            {
              line_bytes = length($0) + 1
              if (used + line_bytes <= max_bytes) {
                print
                used += line_bytes
                shown++
              }
            }
          ' "$scan_directory/matches.md" > "$scan_directory/comment-matches.md"

          shown_match_count="$(LC_ALL=C awk '/^- <a /{count++} END { print count + 0 }' "$scan_directory/comment-matches.md")"
          cat "$scan_directory/comment-matches.md" >> "$scan_directory/comment.md"
          if (( shown_match_count < match_count )); then
            printf '_Showing %s of %s matches. The complete report is in the workflow summary._\n\n' \
              "$shown_match_count" "$match_count" >> "$scan_directory/comment.md"
          fi

          jq -n --rawfile body "$scan_directory/comment.md" '{body: $body}' \
            | gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input -
          gh api -X PATCH "repos/$REPOSITORY/pulls/$PR_NUMBER" -f state=closed

  require-minimal-base:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
    concurrency:
      group: recipe-minimal-base-policy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Require minimal as the pull request base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.base.ref')"
          if [[ "$BASE_REF" == 'minimal' ]]; then
            exit 0
          fi

          marker='<!-- recipe-minimal-base-policy -->'
          reason="$marker
          Development pull requests must target \`minimal\`. This pull request targets \`$BASE_REF\`. Rebase or restack the branch as needed, then change the base. Automation does not retarget branches."

          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | .body // ""')"
          if ! grep --fixed-strings --quiet "$marker" <<< "$comments"; then
            gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$reason"
          fi

          printf 'Development pull requests must target minimal; found %s.\n' "$BASE_REF"
          exit 1

  draft-conflicts:
    if: github.event_name == 'push' || github.event.pull_request.state == 'open'
    concurrency:
      group: recipe-merge-conflict-policy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Convert conflicting pull requests to draft
        env:
          # GITHUB_TOKEN can read and comment on pull requests but GitHub's
          # GraphQL draft mutation rejects it. A repository-scoped token can
          # be supplied as RECIPE_POLICY_TOKEN when automatic conversion is
          # required; the workflow reports the missing capability otherwise.
          GH_TOKEN: ${{ secrets.RECIPE_POLICY_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            numbers="$PR_NUMBER"
          else
            numbers="$(gh pr list \
              --repo "$REPOSITORY" \
              --state open \
              --base minimal \
              --limit 1000 \
              --json number \
              --jq '.[].number')"
          fi
          if [[ -z "$numbers" ]]; then
            exit 0
          fi
          mapfile -t pr_numbers <<< "$numbers"

          marker='<!-- recipe-merge-conflict-policy -->'
          failed_prs=()
          for pr_number in "${pr_numbers[@]}"; do
            mergeable='unknown'
            draft='false'

            for attempt in 1 2 3 4 5; do
              pull_request="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
              state="$(jq --raw-output '.state' <<< "$pull_request")"
              base_ref="$(jq --raw-output '.base.ref' <<< "$pull_request")"
              draft="$(jq --raw-output '.draft' <<< "$pull_request")"
              mergeable="$(jq --raw-output '
                if .mergeable == null then "unknown"
                elif .mergeable then "mergeable"
                else "conflicting"
                end
              ' <<< "$pull_request")"

              if [[ "$state" != 'open' || "$base_ref" != 'minimal' || "$mergeable" != 'unknown' ]]; then
                break
              fi

              if (( attempt < 5 )); then
                sleep $((attempt * 2))
              fi
            done

            if [[ "$state" != 'open' || "$base_ref" != 'minimal' ]]; then
              continue
            fi

            if [[ "$mergeable" == 'unknown' ]]; then
              printf 'GitHub still reports mergeability as unknown for PR %s; deferring.\n' "$pr_number"
              continue
            fi

            if [[ "$mergeable" == 'mergeable' ]]; then
              continue
            fi

            if [[ "$draft" != 'true' ]]; then
              if ! mutation_error="$(gh pr ready "$pr_number" --repo "$REPOSITORY" --undo 2>&1)"; then
                printf 'Could not convert conflicting PR %s to draft:\n%s\n' "$pr_number" "$mutation_error" >&2
                {
                  printf '### Draft conversion blocked for PR #%s\n\n' "$pr_number"
                  printf 'GitHub reported the following mutation error:\n\n```text\n%s\n```\n\n' "$mutation_error"
                  printf 'The workflow can read the conflict, but automatic draft conversion requires the `RECIPE_POLICY_TOKEN` repository secret with pull-request write access. Mark the PR draft manually or configure that token.\n\n'
                } >> "$GITHUB_STEP_SUMMARY"
                failed_prs+=("$pr_number")
                continue
              fi
            fi

            reason="$marker
            GitHub currently reports conflicts with \`minimal\`. This pull request is draft until the branch is resolved. Mark it ready manually after GitHub reports it mergeable."
            comments="$(gh api --paginate "repos/$REPOSITORY/issues/$pr_number/comments?per_page=100" \
              --jq '.[] | .body // ""')"
            if ! grep --fixed-strings --quiet "$marker" <<< "$comments"; then
              gh api -X POST "repos/$REPOSITORY/issues/$pr_number/comments" -f body="$reason"
            fi
          done

          if (( ${#failed_prs[@]} != 0 )); then
            printf 'Draft conversion failed for PRs: %s.\n' "${failed_prs[*]}" >&2
            exit 1
          fi
